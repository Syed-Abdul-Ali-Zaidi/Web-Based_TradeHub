{% extends "layout.html" %}

{% block title %} Barter {% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <h2 class="mb-4">List a New Item for Trade</h2>
    
    <form method="post" enctype="multipart/form-data" class="card shadow-sm p-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Post Item</button>
    </form>
    
    <div class="mt-3">
        <a href="{% url 'post_list_view' %}" class="text-decoration-none">&larr; Back to Marketplace</a>
    </div>
</div>
{% endblock %}
